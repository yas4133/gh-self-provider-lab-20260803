name: GH-R60 pinned self-repository resolver

on:
  workflow_call:

permissions:
  contents: read

jobs:
  resolve-self:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve provider-owned action
        id: probe
        uses: $/actions/probe
      - name: Persist resolved marker
        run: printf '%s\n' '${{ steps.probe.outputs.marker }}' > resolved-marker.txt
      - name: Upload resolved marker
        uses: actions/upload-artifact@v4
        with:
          name: gh-r60-self-resolution-${{ github.run_id }}
          path: resolved-marker.txt
          retention-days: 1
