name: GH-R60 pinned nested self resolver

on:
  workflow_call:

permissions:
  contents: read

jobs:
  resolve-nested-self:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve provider-owned outer and inner actions
        id: probe
        uses: $/actions/nested-outer
      - name: Persist nested marker
        run: printf '%s\n' '${{ steps.probe.outputs.marker }}' > resolved-nested-marker.txt
      - name: Upload nested marker
        uses: actions/upload-artifact@v4
        with:
          name: gh-r60-nested-resolution-${{ github.run_id }}
          path: resolved-nested-marker.txt
          retention-days: 1
