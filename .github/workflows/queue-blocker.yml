name: GH-R60 queue snapshot blocker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-r60-queue-snapshot
  cancel-in-progress: false

jobs:
  hold-group:
    runs-on: ubuntu-latest
    steps:
      - name: Hold concurrency group for queued-resolution control
        run: sleep 300
