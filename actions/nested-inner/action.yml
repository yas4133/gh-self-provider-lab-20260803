name: GH-R60 nested inner provider V2
description: Mutated provider-default inner action canary

outputs:
  marker:
    description: Exact nested provider default marker
    value: ${{ steps.marker.outputs.value }}

runs:
  using: composite
  steps:
    - id: marker
      shell: bash
      run: printf '%s\n' 'value=PROVIDER_NESTED_INNER_V2' >> "$GITHUB_OUTPUT"
