name: GH-R60 queued snapshot probe V2
description: Post-queue default-branch mutation canary

outputs:
  marker:
    description: Current default-branch action marker
    value: ${{ steps.marker.outputs.value }}

runs:
  using: composite
  steps:
    - id: marker
      shell: bash
      run: printf '%s\n' 'value=QUEUE_MUTATED_V2' >> "$GITHUB_OUTPUT"
