name: GH-R60 provider probe
description: Owned mutated default-branch canary

outputs:
  marker:
    description: Exact provider revision marker
    value: ${{ steps.marker.outputs.value }}

runs:
  using: composite
  steps:
    - id: marker
      shell: bash
      run: printf '%s\n' 'value=PROVIDER_MUTATED_V2' >> "$GITHUB_OUTPUT"
