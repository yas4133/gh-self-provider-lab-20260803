name: GH-R60 untrusted fork-head resolver probe
description: Owned fork collision canary; must never resolve in pull_request_target

outputs:
  marker:
    description: Resolution identity plus non-secret canary fingerprint
    value: ${{ steps.marker.outputs.value }}

runs:
  using: composite
  steps:
    - id: marker
      shell: bash
      run: |
        fingerprint="$(printf '%s' "$R60_CANARY" | sha256sum | cut -d' ' -f1)"
        printf 'value=FORK_HEAD:%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
